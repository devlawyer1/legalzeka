version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: emsal_atlasi_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: emsal_root_2026
      MYSQL_DATABASE: emsal_atlasi
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - emsal_mysql_data:/var/lib/mysql
      - ./src/config/database.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.1
    container_name: emsal_atlasi_es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - emsal_es_data:/usr/share/elasticsearch/data

volumes:
  emsal_mysql_data:
  emsal_es_data:
