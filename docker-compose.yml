version: "3.8"

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: emsal_atlasi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: emsal_atlasi
    ports:
      - "5432:5432"
    volumes:
      - emsal_postgres_data_v2:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: legalzeka_backend
    restart: unless-stopped
    depends_on:
      - postgres
      - yargi-mcp
    env_file:
      - .env
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/emsal_atlasi
      - YARGI_MCP_URL=http://yargi-mcp:8000
    ports:
      - "3001:3001"

  yargi-mcp:
    image: ghcr.io/devlawyer1/yargi-mcp:v0.2.0-lz.1
    container_name: yargi_mcp_server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ALLOWED_ORIGINS=*

  client:
    build:
      context: ./client
    container_name: legalzeka_client
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
    ports:
      - "3002:3002"

volumes:

  emsal_postgres_data_v2:
