services:

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: emsal_atlasi
    ports:
      - "5432:5432"
    volumes:
      - emsal_postgres_data_v2:/var/lib/postgresql/data

  postgres-test:
    image: pgvector/pgvector:pg16
    profiles:
      - test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: legalzeka_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d legalzeka_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend-test:
    build:
      context: .
      dockerfile: Dockerfile.test
    profiles:
      - test
    environment:
      - NODE_ENV=test
      - TEST_DATABASE_URL=postgresql://postgres:postgrespassword@postgres-test:5432/legalzeka_test
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres-test:5432/legalzeka_test
      - JWT_SECRET=phase1a-container-test-secret
      - LOCAL_UPLOAD_DIR=/app/uploads
    depends_on:
      postgres-test:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      - postgres
      - yargi-mcp
    env_file:
      - .env
    environment:
      - PORT=3001
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgresql://postgres:postgrespassword@postgres:5432/emsal_atlasi}
      - LOCAL_UPLOAD_DIR=/app/uploads
      - YARGI_MCP_URL=http://yargi-mcp:8000
      - LEGAL_CORPUS_ENABLED=true
      - LEGAL_CORPUS_SEMANTIC_ENABLED=false
      - LEGAL_CORPUS_EMBEDDING_URL=http://embedding:80
    ports:
      - "3001:3001"
    volumes:
      - legal_document_uploads:/app/uploads

  document-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["node", "src/workers/documentWorker.js"]
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgresql://postgres:postgrespassword@postgres:5432/emsal_atlasi}
      - LOCAL_UPLOAD_DIR=/app/uploads
      - DOCUMENT_WORKER_CONCURRENCY=${DOCUMENT_WORKER_CONCURRENCY:-2}
      - DOCUMENT_JOB_MAX_ATTEMPTS=${DOCUMENT_JOB_MAX_ATTEMPTS:-3}
      - DOCUMENT_JOB_TIMEOUT_MS=${DOCUMENT_JOB_TIMEOUT_MS:-120000}
      - DOCUMENT_JOB_STALE_AFTER_MS=${DOCUMENT_JOB_STALE_AFTER_MS:-300000}
      - DOCUMENT_JOB_POLL_INTERVAL_MS=${DOCUMENT_JOB_POLL_INTERVAL_MS:-1000}
      - FILE_SCANNER_PROVIDER=${FILE_SCANNER_PROVIDER:-noop}
      - FILE_SCANNER_REQUIRED=${FILE_SCANNER_REQUIRED:-false}
    volumes:
      - legal_document_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "process.kill(1, 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  legal-data-worker:
    build:
      context: ./services/legal-data-worker
    profiles:
      - worker
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgresql://postgres:postgrespassword@postgres:5432/emsal_atlasi}
      - EMBEDDING_BASE_URL=http://embedding:80
      - EMBEDDING_ENABLED=false
      - BEDESTEN_PHRASE=karar
      - REQUEST_DELAY_MS=1500
      - REQUEST_DELAY_JITTER_MS=1000
      - MEVZUAT_MODE=all
      - MEVZUAT_PAGE_SIZE=50
      - MEVZUAT_MAX_RECORDS=0
      - BEDESTEN_PAGE_COOLDOWN_MS=10000
      - BEDESTEN_429_SLEEP_MS=90000
    depends_on:
      - postgres
    restart: "no"

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    profiles:
      - embedding
    command: --model-id intfloat/multilingual-e5-large
    ports:
      - "8080:80"
    restart: unless-stopped

  yargi-mcp:
    image: ghcr.io/devlawyer1/yargi-mcp:v0.2.0-lz.1
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ALLOWED_ORIGINS=*

  client:
    build:
      context: ./client
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
    ports:
      - "3002:3002"

volumes:

  emsal_postgres_data_v2:
  legal_document_uploads:
