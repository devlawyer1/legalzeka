name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_ENV: test
  TEST_DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:55432/legalzeka_test
  DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:55432/legalzeka_test
  JWT_SECRET: ci-only-not-a-production-secret
  CREDENTIAL_ENCRYPTION_KEY: CAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQ=

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm --prefix client ci
      - run: npm --prefix client run lint

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: find src test -name '*.js' -print0 | xargs -0 -n1 node --check

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:unit

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgrespassword, POSTGRES_DB: legalzeka_test }
        ports: [55432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d legalzeka_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:integration

  migration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgrespassword, POSTGRES_DB: legalzeka_test }
        ports: [55432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d legalzeka_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run migrate:status
      - run: npm run migrate:preflight
      - run: npm run migrate
      - run: npm run migrate:verify

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm --prefix client ci
      - run: npm --prefix client run build
      - run: docker build -f client/Dockerfile -t legalzeka-frontend:${{ github.sha }} client

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.backend -t legalzeka-backend:${{ github.sha }} .
      - name: Immutable image manifest and checksum
        run: docker image inspect legalzeka-backend:${{ github.sha }} > backend-image-manifest.json && sha256sum backend-image-manifest.json > backend-image-manifest.sha256
      - uses: actions/upload-artifact@v4
        with: { name: backend-image-manifest-${{ github.sha }}, path: "backend-image-manifest.*" }

  worker-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.backend -t legalzeka-workers:${{ github.sha }} .
      - run: docker run --rm legalzeka-workers:${{ github.sha }} node --check src/workers/documentWorker.js
      - run: docker run --rm legalzeka-workers:${{ github.sha }} node --check src/workers/agentWorker.js
      - run: docker run --rm legalzeka-workers:${{ github.sha }} node --check src/workers/notificationWorker.js
      - run: docker run --rm legalzeka-workers:${{ github.sha }} node --check src/workers/schedulerWorker.js
      - run: docker build -t legalzeka-legal-data-worker:${{ github.sha }} services/legal-data-worker

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm --prefix client ci
      - name: Lockfiles remain deterministic
        run: git diff --exit-code package-lock.json client/package-lock.json
      - run: npm audit --omit=dev --workspaces=false
      - run: npm --prefix client audit --omit=dev --workspaces=false

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.backend -t legalzeka-backend:scan .
      - run: docker build -f client/Dockerfile -t legalzeka-frontend:scan client
      - run: docker build -t legalzeka-legal-data-worker:scan services/legal-data-worker
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: legalzeka-backend:scan, format: table, exit-code: "1", severity: "CRITICAL,HIGH", ignore-unfixed: true }
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: legalzeka-frontend:scan, format: table, exit-code: "1", severity: "CRITICAL,HIGH", ignore-unfixed: true }
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: legalzeka-legal-data-worker:scan, format: table, exit-code: "1", severity: "CRITICAL,HIGH", ignore-unfixed: true }

  browser-e2e:
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-build, integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Production-like browser suite
        env: { E2E_BASE_URL: "${{ vars.STAGING_SMOKE_URL }}" }
        run: |
          if [ -z "$E2E_BASE_URL" ]; then echo "STAGING_SMOKE_URL is required for protected-branch E2E"; exit 1; fi
          npm run test:e2e

  release-gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - lint
      - syntax
      - unit-tests
      - integration-tests
      - migration-tests
      - frontend-build
      - backend-build
      - worker-builds
      - dependency-audit
      - secret-scan
      - container-scan
      - browser-e2e
    environment: production-approval
    steps:
      - run: echo "Manual approval passed. Deployment remains outside this workflow."
