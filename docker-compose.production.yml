x-app: &app
  image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY}/legalzeka-backend:${IMAGE_TAG:?use immutable git SHA}
  env_file: ["${PRODUCTION_ENV_FILE:-.env.example}"]
  environment:
    NODE_ENV: production
    PORT: 3001
    DATABASE_URL: ${DATABASE_URL:?managed PostgreSQL is required}
    REDIS_URL: ${REDIS_URL:?managed Redis is required}
    STORAGE_PROVIDER: s3
    S3_BUCKET: ${S3_BUCKET:?private S3 bucket is required}
    S3_REGION: ${S3_REGION:?S3 region is required}
    CORS_ORIGINS: ${CORS_ORIGINS:?explicit CORS allowlist is required}
    RELEASE_VERSION: ${IMAGE_TAG}
  read_only: true
  tmpfs: [/tmp, /app/uploads/.tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: always
  stop_grace_period: 30s
  deploy: { replicas: 2, resources: { limits: { cpus: "2.0", memory: 2G } } }

services:
  reverse-proxy:
    image: nginx:1.27-alpine
    ports: ["80:8080"]
    volumes: ["./deploy/nginx/legalzeka.conf:/etc/nginx/conf.d/default.conf:ro"]
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: always
    healthcheck: { test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health/live], interval: 15s, timeout: 5s, retries: 5 }
    deploy: { resources: { limits: { cpus: "0.5", memory: 256M } } }
    depends_on: [backend, frontend]

  frontend:
    image: ${IMAGE_REGISTRY}/legalzeka-frontend:${IMAGE_TAG}
    environment: { NODE_ENV: production, NEXT_PUBLIC_API_URL: /api }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: always
    healthcheck: { test: [CMD, node, -e, "fetch('http://127.0.0.1:3002').then(r=>{if(!r.ok)process.exit(1)})"], interval: 15s, timeout: 5s, retries: 10, start_period: 20s }
    deploy: { replicas: 2, resources: { limits: { cpus: "1.0", memory: 1G } } }

  backend:
    <<: *app
    healthcheck: { test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)})"], interval: 15s, timeout: 5s, retries: 5 }

  document-worker:
    <<: *app
    command: [node, src/workers/documentWorker.js]
    deploy: { replicas: 2, resources: { limits: { cpus: "2.0", memory: 2G } } }
    healthcheck: { test: [CMD, node, -e, "process.kill(1,0)"], interval: 30s, timeout: 5s, retries: 3 }

  agent-worker:
    <<: *app
    command: [node, src/workers/agentWorker.js]
    healthcheck: { test: [CMD, node, -e, "process.kill(1,0)"], interval: 30s, timeout: 5s, retries: 3 }

  notification-worker:
    <<: *app
    command: [node, src/workers/notificationWorker.js]
    healthcheck: { test: [CMD, node, -e, "process.kill(1,0)"], interval: 30s, timeout: 5s, retries: 3 }

  scheduler-worker:
    <<: *app
    command: [node, src/workers/schedulerWorker.js]
    deploy: { replicas: 2, resources: { limits: { cpus: "1.0", memory: 1G } } }
    healthcheck: { test: [CMD, node, -e, "process.kill(1,0)"], interval: 30s, timeout: 5s, retries: 3 }

  legal-data-worker:
    image: ${IMAGE_REGISTRY}/legalzeka-legal-data-worker:${IMAGE_TAG}
    profiles: [ingest]
    env_file: ["${PRODUCTION_ENV_FILE:-.env.example}"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    deploy: { resources: { limits: { cpus: "1.0", memory: 1G } } }

  embedding-service:
    image: ${EMBEDDING_IMAGE:?pin an immutable embedding image digest}
    profiles: [self-hosted-embedding]
    restart: always
    deploy: { resources: { limits: { cpus: "4.0", memory: 8G } } }
